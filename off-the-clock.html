<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script>/* theme before first paint: ?theme= from another of the three sites, else stored choice, else device */(function(){try{var d=document.documentElement,u=new URL(location.href),q=u.searchParams.get("theme");if(q==="dark"||q==="light"){localStorage.setItem("lori-theme",q);u.searchParams.delete("theme");history.replaceState(history.state,"",u.pathname+u.search+u.hash);}var s=localStorage.getItem("lori-theme");d.setAttribute("data-theme",s==="dark"||s==="light"?s:(window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light"));}catch(e){}})();</script>
<title>Off the clock — Lorisca Cessia</title>
<meta name="description" content="Communities, events, and hobbies. The rest of me.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css?v=2">
<link rel="stylesheet" href="shared.css?v=3">
</head>
<body data-page="offtheclock">

<nav class="nav">
  <div class="nav-inner lh">
    <a class="lh-brand" href="https://lori-sca.github.io/"><b>Lorisca Cessia</b><span>People, operations and the data behind them</span></a>
    <div class="lh-links" id="lh-links"><a href="https://lori-sca.github.io/">Home</a><a href="https://lorisca-analytics.github.io/">Work</a><a href="https://lorisca-builds.github.io/">Builds</a><a href="https://lori-sca.github.io/off-the-clock.html">Off the clock</a><a href="https://lori-sca.github.io/about.html">About</a></div>
  </div>
  <div class="subnav"><div class="subnav-inner" id="subnav-inner"></div></div>
</nav>

<main>
  <section class="page-hero oc-hero" id="top">
    <div class="wrap">
      <span class="eyebrow" id="oc-eyebrow"></span>
      <h1 class="oc-title" id="oc-headline"></h1>
      <div class="oc-hero-row">
        <p class="lede" id="oc-lede"></p>
        <div class="oc-clock" id="oc-clock" hidden>
          <svg class="oc-clock-face" viewBox="0 0 32 32" width="34" height="34" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="16" cy="16" r="13"/><line id="oc-hour" x1="16" y1="16" x2="16" y2="10" stroke-linecap="round"/><line id="oc-min" x1="16" y1="16" x2="22" y2="16" stroke-linecap="round"/></svg>
          <span class="oc-clock-txt">
            <span class="k">San Francisco right now</span>
            <span><strong id="oc-time">--:--</strong> &middot; off the clock</span>
          </span>
        </div>
      </div>
    </div>
  </section>

  <section class="section" id="fun">
    <div class="wrap">
      <div class="fun-grid" id="post-list"></div>
    </div>
  </section>

  <div class="band oc-field" id="field">
    <div class="wrap">
      <div class="section-head">
        <div class="sh-main">
          <span class="eyebrow" id="sec-field-eyebrow"></span>
          <h2 id="sec-field-headline"></h2>
        </div>
        <p class="sh-side" id="sec-field-side"></p>
      </div>
      <div class="tile-grid" id="tile-grid"></div>
    </div>
  </div>

  <div class="band" id="contact">
    <div class="wrap">
      <div class="section-head">
        <div class="sh-main">
          <span class="eyebrow" id="sec-contact-eyebrow"></span>
          <h2 id="sec-contact-headline"></h2>
        </div>
      </div>
      <div class="cta-row" id="contact-row" style="margin-top:0;"></div>
    </div>
  </div>
</main>

<footer class="site-footer oc-footer">
  <div class="wrap">
    <div class="foot-links">
      <a href="https://lori-sca.github.io">Lorisca Cessia</a>
      <a href="https://lorisca-analytics.github.io">Analytics Work</a>
      <a href="https://lorisca-builds.github.io">Builds</a>
      <a href="https://lori-sca.github.io/about.html">About</a>
    </div>
    <p class="fine">&copy; <span id="year"></span> LORISCA CESSIA</p>
  </div>
</footer>

<script src="site.js?v=2"></script>
<script src="https://lori-sca.github.io/header.js?v=3"></script>
<script src="motion.js?v=2"></script>
<script>
  /* ---------- fun cards: title first, photo below, story expander ---------- */
  function postCard(p, i) {
    const card = document.createElement("article");
    card.className = "fun-card tilt-" + (i % 3);
    const top = document.createElement("div");
    top.className = "fun-top";
    const meta = document.createElement("div");
    meta.className = "post-meta";
    const em = document.createElement("span");
    em.className = "post-emoji";
    em.textContent = p.emoji || "✳";
    meta.appendChild(em);
    if (p.date) {
      const dt = document.createElement("span");
      dt.className = "post-date";
      dt.textContent = prettyDate(p.date);
      meta.appendChild(dt);
    }
    top.appendChild(meta);
    const h = document.createElement("h3");
    h.textContent = p.title || "";
    top.appendChild(h);
    if (p.text) {
      const t = document.createElement("p");
      t.textContent = p.text;
      top.appendChild(t);
    }
    card.appendChild(top);
    if (p.photo) {
      const ph = document.createElement("div");
      ph.className = "fun-photo";
      const img = document.createElement("img");
      img.src = p.photo; img.alt = p.title || ""; img.loading = "lazy";
      img.setAttribute("data-zoom", p.photo);
      img.dataset.caption = p.title || "";
      ph.appendChild(img);
      card.appendChild(ph);
    }
    if (p.story || p.embed) {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "fun-story-btn";
      btn.setAttribute("aria-expanded", "false");
      btn.innerHTML = '<span>The story</span><span class="plus" aria-hidden="true">+</span>';
      const panel = document.createElement("div");
      panel.className = "fun-story-panel";
      panel.hidden = true;
      if (p.story) {
        const st = document.createElement("p");
        st.textContent = p.story;
        panel.appendChild(st);
      }
      const emb = embedNode(p.embed);
      if (emb) panel.appendChild(emb);
      btn.addEventListener("click", () => {
        const open = panel.hidden;
        panel.hidden = !open;
        btn.setAttribute("aria-expanded", String(open));
        btn.querySelector(".plus").textContent = open ? "–" : "+";
      });
      card.appendChild(btn);
      card.appendChild(panel);
    }
    return card;
  }
  /* ---------- involvement tiles with detail panels ---------- */
  function tileNode(t) {
    const d = document.createElement("div");
    d.className = "tile";
    const media = document.createElement("div");
    media.className = "tile-media";
    if (t.photo) {
      const img = document.createElement("img");
      img.src = t.photo;
      img.alt = [t.place, t.context].filter(Boolean).join(" — ");
      img.loading = "lazy";
      img.setAttribute("data-zoom", t.photo);
      img.dataset.caption = [t.place, t.context].filter(Boolean).join(" · ");
      if (t.link) img.dataset.link = t.link;
      media.appendChild(img);
    } else {
      const ph = document.createElement("div");
      ph.className = "tile-empty";
      ph.textContent = (t.place || "?").trim().charAt(0).toUpperCase();
      media.appendChild(ph);
    }
    const cap = document.createElement("div");
    cap.className = "tile-cap";
    const name = document.createElement("strong");
    name.textContent = t.place || "";
    cap.appendChild(name);
    if (t.context) {
      const ctx = document.createElement("span");
      ctx.textContent = t.context;
      cap.appendChild(ctx);
    }
    media.appendChild(cap);
    d.appendChild(media);
    if (t.badge) {
      const b = document.createElement("span");
      b.className = "tile-badge";
      b.textContent = t.badge;
      d.appendChild(b);
    }
    if (t.details || t.link) {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "tile-plus";
      btn.setAttribute("aria-label", "Details for " + (t.place || "tile"));
      btn.setAttribute("aria-expanded", "false");
      btn.textContent = "+";
      const panel = document.createElement("div");
      panel.className = "tile-panel";
      panel.hidden = true;
      if (t.details) {
        const p = document.createElement("p");
        p.textContent = t.details;
        panel.appendChild(p);
      }
      if (t.link) {
        const a = document.createElement("a");
        a.className = "text-link";
        a.href = t.link; a.target = "_blank"; a.rel = "noopener";
        a.textContent = "Open link ↗";
        panel.appendChild(a);
      }
      btn.addEventListener("click", (e) => {
        e.stopPropagation();
        const open = panel.hidden;
        panel.hidden = !open;
        btn.setAttribute("aria-expanded", String(open));
        btn.textContent = open ? "–" : "+";
      });
      media.appendChild(btn);
      d.appendChild(panel);
    }
    return d;
  }
  /* ---------- live SF clock ---------- */
  function tickClock() {
    const pill = document.getElementById("oc-clock");
    const t = document.getElementById("oc-time");
    if (!pill || !t) return;
    try {
      const now = new Date();
      t.textContent = new Intl.DateTimeFormat("en-US", {
        hour: "numeric", minute: "2-digit", timeZone: "America/Los_Angeles"
      }).format(now);
      const mins = now.getMinutes() + now.getHours() * 60;
      const hr = document.getElementById("oc-hour");
      const mn = document.getElementById("oc-min");
      if (hr) hr.setAttribute("transform", "rotate(" + ((now.getHours() % 12) * 30 + mins % 60 * 0.5) + " 16 16)");
      if (mn) mn.setAttribute("transform", "rotate(" + ((mins % 60) * 6) + " 16 16)");
      pill.hidden = false;
    } catch (e) { /* clock stays hidden */ }
  }
  /* ---------- boot ---------- */
  function slimFooter() {
    const fl = document.querySelector(".foot-links");
    if (!fl) return;
    const keep = [
      "https://lori-sca.github.io",
      "https://lorisca-analytics.github.io",
      "https://lorisca-builds.github.io",
      "https://lori-sca.github.io/about.html",
    ];
    [...fl.children].forEach((a) => {
      if (!keep.includes(a.getAttribute("href"))) a.remove();
    });
  }
  loadJSON("data/site.json").then((site) => { applySiteChrome(site); slimFooter(); }).catch(() => {});
  Promise.all([
    loadJSON("data/off-the-clock.json").catch(() => null),
    fetch("fun/layout.json").then((r) => r.ok ? r.json() : null).catch(() => null)
  ]).then(([oc, layout]) => {
    if (oc) {
      setMeta(oc.meta);
      const order = (layout && layout.sections) || [];
      const byHref = {};
      (oc.subnav || []).forEach((s) => { byHref[s.href] = s; });
      const items = [];
      if (byHref["#top"]) items.push(byHref["#top"]);
      order.forEach((k) => { if (byHref["#" + k]) items.push(byHref["#" + k]); });
      ["#field", "#fun"].forEach((h) => {
        if (!order.length && byHref[h] && !items.includes(byHref[h])) items.push(byHref[h]);
      });
      if (byHref["#contact"]) items.push(byHref["#contact"]);
      renderSubnav(items);
      const hero = oc.hero || {};
      setText("oc-eyebrow", hero.eyebrow);
      setHeadline(document.getElementById("oc-headline"), hero.headline);
      setText("oc-lede", hero.lede);
      mountSectionMedia("top", hero);
      const S = oc.sections || {};
      if (S.field) {
        setText("sec-field-eyebrow", S.field.eyebrow);
        setHeadline(document.getElementById("sec-field-headline"), S.field.headline);
        setText("sec-field-side", S.field.side);
        mountSectionMedia("field", S.field);
      }
      if (S.contact) {
        setText("sec-contact-eyebrow", S.contact.eyebrow);
        setHeadline(document.getElementById("sec-contact-headline"), S.contact.headline);
        mountSectionMedia("contact", S.contact);
      }
    }
    // section order, editable in the admin ("Page sections")
    const order = (layout && layout.sections) || [];
    if (order.length) {
      const main = document.querySelector("main");
      const band = document.getElementById("contact");
      const map = { field: document.getElementById("field"), fun: document.getElementById("fun") };
      order.forEach((key) => {
        const el = map[key];
        if (el && band) main.insertBefore(el, band);
      });
    }
    tickClock();
    setInterval(tickClock, 30000);
  });
  // lightbox: click any zoomable photo to see it full-size
  function openLightbox(src, alt, caption, link) {
    const lb = document.createElement("div");
    lb.className = "lightbox";
    const fig = document.createElement("figure");
    fig.className = "lb-fig";
    const full = document.createElement("img");
    full.src = src;
    full.alt = alt || "";
    fig.appendChild(full);
    if (caption) {
      const cap = document.createElement("figcaption");
      cap.className = "lb-cap";
      cap.textContent = caption;
      if (link) {
        const a = document.createElement("a");
        a.href = link; a.target = "_blank"; a.rel = "noopener";
        a.textContent = "Open link ↗";
        cap.appendChild(a);
      }
      fig.appendChild(cap);
    }
    lb.appendChild(fig);
    const close = () => lb.remove();
    lb.addEventListener("click", close);
    document.addEventListener("keydown", function esc(ev) {
      if (ev.key === "Escape") { close(); document.removeEventListener("keydown", esc); }
    });
    document.body.appendChild(lb);
  }
  document.addEventListener("click", (e) => {
    const z = e.target.closest("[data-zoom]");
    if (!z) return;
    openLightbox(z.getAttribute("data-zoom"), z.alt || "", z.dataset.caption || "", z.dataset.link || "");
  });
  fetch("fun/tiles.json")
    .then((r) => { if (!r.ok) throw new Error("tiles not found"); return r.json(); })
    .then((d) => {
      const tiles = d.tiles || [];
      if (!tiles.length) { document.getElementById("field").hidden = true; return; }
      const grid = document.getElementById("tile-grid");
      tiles.forEach((t) => grid.appendChild(tileNode(t)));
    })
    .catch(() => { document.getElementById("field").hidden = true; });
  fetch("fun/posts.json")
    .then((r) => { if (!r.ok) throw new Error("posts not found"); return r.json(); })
    .then((d) => {
      const list = document.getElementById("post-list");
      (d.posts || []).forEach((p, i) => list.appendChild(postCard(p, i)));
    })
    .catch(() => {
      document.getElementById("post-list").innerHTML =
        "<p class='lede'>Posts couldn't load — try refreshing.</p>";
    });
</script>
</body>
</html>
