<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="'Plus Jakarta Sans', system-ui, sans-serif">
  <rect width="1200" height="630" fill="#EEF2F6"/>
  <text x="600" y="90" text-anchor="middle" font-family="Archivo, system-ui, sans-serif" font-weight="800" font-size="44" letter-spacing="-1" fill="#1E2D42">The CMS behind this site</text>
  <text x="600" y="128" text-anchor="middle" font-size="20" fill="#4A6A8F">Edit words. Hit save. It goes live.</text>

  <!-- step 1 -->
  <g>
    <rect x="80" y="220" width="280" height="220" rx="14" fill="#FFFFFF" stroke="#D5DFE8" stroke-width="2"/>
    <text x="220" y="268" text-anchor="middle" font-family="'Martian Mono', monospace" font-size="15" letter-spacing="2" fill="#4A6A8F">EDIT</text>
    <text x="220" y="310" text-anchor="middle" font-weight="700" font-size="24" fill="#1E2D42">Admin panel</text>
    <text x="220" y="348" text-anchor="middle" font-size="17" fill="#4A6A8F">Words, photos,</text>
    <text x="220" y="374" text-anchor="middle" font-size="17" fill="#4A6A8F">order, per section</text>
  </g>
  <!-- arrow -->
  <g stroke="#5B7FA6" stroke-width="3" fill="none">
    <line x1="380" y1="330" x2="440" y2="330"/>
    <polyline points="428,318 444,330 428,342"/>
  </g>
  <!-- step 2 -->
  <g>
    <rect x="460" y="220" width="280" height="220" rx="14" fill="#FFFFFF" stroke="#D5DFE8" stroke-width="2"/>
    <text x="600" y="268" text-anchor="middle" font-family="'Martian Mono', monospace" font-size="15" letter-spacing="2" fill="#4A6A8F">SAVE</text>
    <text x="600" y="310" text-anchor="middle" font-weight="700" font-size="24" fill="#1E2D42">GitHub API</text>
    <text x="600" y="348" text-anchor="middle" font-size="17" fill="#4A6A8F">JSON files committed</text>
    <text x="600" y="374" text-anchor="middle" font-size="17" fill="#4A6A8F">straight to the repo</text>
  </g>
  <!-- arrow -->
  <g stroke="#5B7FA6" stroke-width="3" fill="none">
    <line x1="760" y1="330" x2="820" y2="330"/>
    <polyline points="808,318 824,330 808,342"/>
  </g>
  <!-- step 3 -->
  <g>
    <rect x="840" y="220" width="280" height="220" rx="14" fill="#1E2D42"/>
    <text x="980" y="268" text-anchor="middle" font-family="'Martian Mono', monospace" font-size="15" letter-spacing="2" fill="#B8C9D8">LIVE</text>
    <text x="980" y="310" text-anchor="middle" font-weight="700" font-size="24" fill="#FFFFFF">3 sites</text>
    <text x="980" y="348" text-anchor="middle" font-size="17" fill="#B8C9D8">Main · Analytics · Builds</text>
    <text x="980" y="374" text-anchor="middle" font-size="17" fill="#B8C9D8">No build step. No bill.</text>
  </g>

  <text x="600" y="520" text-anchor="middle" font-size="19" font-style="italic" fill="#4A6A8F">The best tool is the one you&#8217;ll actually use.</text>
  <text x="600" y="560" text-anchor="middle" font-family="'Martian Mono', monospace" font-size="14" letter-spacing="2" fill="#7A90A6">LORISCA CESSIA · LORI-SCA.GITHUB.IO/ADMIN</text>
</svg>
