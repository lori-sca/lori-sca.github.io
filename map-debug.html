<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Map debug</title>
<link href="https://api.mapbox.com/mapbox-gl-js/v3.9.1/mapbox-gl.css" rel="stylesheet">
<style>
  body { font-family: system-ui, sans-serif; padding: 2rem; }
  #map { width: 100%; height: 400px; border: 2px solid #333; }
  .pin { width: 20px; height: 20px; border-radius: 50%; background: #d33; border: 3px solid #fff; cursor: pointer; }
  #log { margin-top: 1rem; padding: 1rem; background: #f0f0f0; font-family: monospace; white-space: pre-wrap; }
  .hwrap { position: relative; display: inline-block; margin-top: 2rem; font-size: 24px; }
  .hwrap img { position: absolute; bottom: 130%; left: 50%; transform: translateX(-50%);
    width: 120px; opacity: 0; transition: opacity .25s; pointer-events: none; background: #fff; border: 1px solid #999; }
  .hwrap:hover img, .hwrap.show img { opacity: 1; }
</style>
</head>
<body>
<h1>Map + hover debug (temporary)</h1>
<div id="map"></div>
<div id="log">log:
</div>
<p class="hwrap" id="hw">Hover or click me<img src="assets/hannibal.png" alt="test"></p>

<script src="https://api.mapbox.com/mapbox-gl-js/v3.9.1/mapbox-gl.js"></script>
<script>
  const log = (m) => { document.getElementById("log").textContent += m + "\n"; };
  log("mapboxgl: " + (typeof mapboxgl));
  fetch("assets/mapbox-token.txt").then(r => r.text()).then(tok => {
    mapboxgl.accessToken = tok.trim();
    const map = new mapboxgl.Map({ container: "map", style: "mapbox://styles/mapbox/streets-v12", center: [124.84, 1.47], zoom: 4 });
    const pin = document.createElement("div");
    pin.className = "pin";
    const popup = new mapboxgl.Popup({ offset: 20 }).setHTML("<strong>Manado</strong><br>test popup");
    const marker = new mapboxgl.Marker(pin).setLngLat([124.84, 1.47]).setPopup(popup).addTo(map);
    log("marker added; has togglePopup: " + (typeof marker.togglePopup));
    pin.addEventListener("click", (e) => {
      log("pin clicked; popup.isOpen before=" + popup.isOpen());
      // NOTE: no manual toggle here — testing Mapbox default only
      setTimeout(() => log("popup.isOpen after 500ms=" + popup.isOpen()), 500);
    });
    map.on("error", (e) => log("MAP ERROR: " + (e.error && e.error.message)));
    window.__dbg = { map, marker, popup };
  }).catch(e => log("token fetch failed: " + e.message));

  const hw = document.getElementById("hw");
  hw.addEventListener("click", () => {
    hw.classList.toggle("show");
    const img = hw.querySelector("img");
    const cs = getComputedStyle(img);
    log("hannibal clicked; .show=" + hw.classList.contains("show") + " opacity=" + cs.opacity);
  });
  // diagnostic: what does ANY click actually hit?
  document.addEventListener("click", (e) => {
    const t = e.target;
    log("doc click -> " + t.tagName + (t.id ? "#" + t.id : "") + (t.className && typeof t.className === "string" ? "." + t.className.split(" ")[0] : ""));
  }, true);
  window.addEventListener("error", (e) => log("PAGE ERROR: " + e.message));
</script>
</body>
</html>
