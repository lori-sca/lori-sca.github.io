<script src="content.js"></script>

<script>
  document.getElementById("w-eyebrow").textContent = WRITING.eyebrow;
  document.getElementById("w-headline").textContent = WRITING.headline;
  document.getElementById("w-lede").textContent = WRITING.lede;
  document.getElementById("w-note").textContent = WRITING.note;
  const rows = document.getElementById("w-rows");
  WRITING.pipeline.forEach((t) => {
    const row = document.createElement("div");
    row.className = "pipe-row";
    const title = document.createElement("span");
    title.className = "pipe-title";
    title.textContent = t.title;
    const status = document.createElement("span");
    status.className = "pipe-status";
    status.textContent = "In the pipeline";
    row.appendChild(title); row.appendChild(status);
    rows.appendChild(row);
  });
  const cr = document.getElementById("contact-row");
  [
    { label: "Email", href: "mailto:" + SITE.email },
    { label: "LinkedIn", href: SITE.linkedin },
    { label: "GitHub", href: SITE.github },
  ].forEach((c) => {
    const a = document.createElement("a");
    a.className = "btn ghost"; a.href = c.href; a.target = "_blank"; a.rel = "noopener";
    a.textContent = c.label; cr.appendChild(a);
  });
</script>
