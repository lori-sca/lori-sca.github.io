<script>/* theme before first paint: ?theme= from another of the three sites, else stored choice, else device */(function(){try{var d=document.documentElement,u=new URL(location.href),q=u.searchParams.get("theme");if(q==="dark"||q==="light"){localStorage.setItem("lori-theme",q);u.searchParams.delete("theme");history.replaceState(history.state,"",u.pathname+u.search+u.hash);}var s=localStorage.getItem("lori-theme");d.setAttribute("data-theme",s==="dark"||s==="light"?s:(window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light"));}catch(e){}})();</script>

<script>
  /* Sections come from data/writing.json -> layout (edited in the admin's page builder).
     If that key is ever missing, the older fixed render below still works. */
  function renderWriting(site, w) {
    applySiteChrome(site);
    setMeta(w.meta);
    if (w.layout && w.layout.sections && window.Theme) {
      Theme.renderPage(document.getElementById("page-main"), w, { site: site });
      renderSubnav(Theme.menu(w));
      return;
    }
    legacyWriting(site, w);
  }
  function legacyWriting(site, w) {
    {
      applySiteChrome(site);
      setMeta(w.meta);
      renderSubnav(w.subnav);
      setText("w-pipe-head", (w.sections && w.sections.pipeline || {}).head);
      const cs = (w.sections || {}).contact || {};
      setText("sec-contact-eyebrow", cs.eyebrow);
      setHeadline(document.getElementById("sec-contact-headline"), cs.headline);
      // editor-added picture + links per section (hero keys live on w itself)
      mountSectionMedia("top", w);
      mountSectionMedia("pipeline", (w.sections || {}).pipeline);
      mountSectionMedia("contact", (w.sections || {}).contact);
      document.getElementById("w-eyebrow").textContent = w.eyebrow;
      document.getElementById("w-headline").textContent = w.headline;
      document.getElementById("w-lede").textContent = w.lede;
      document.getElementById("w-note").textContent = w.note;
      const rows = document.getElementById("w-rows");
      (w.pipeline || []).forEach((t) => {
        const row = document.createElement("div");
        row.className = "pipe-row";
        const title = document.createElement("span");
        title.className = "pipe-title";
        if (t.link) {
          const a = document.createElement("a");
          a.href = t.link; a.target = "_blank"; a.rel = "noopener";
          a.textContent = t.title;
          title.appendChild(a);
        } else {
          title.textContent = t.title;
        }
        const status = document.createElement("span");
        status.className = "pipe-status";
        status.textContent = (w.labels && w.labels.pipeStatus) || "In the pipeline";
        row.appendChild(title); row.appendChild(status);
        rows.appendChild(row);
      });
    }
  }
  Promise.all([loadJSON("data/site.json"), loadJSON("data/writing.json")])
    .then(([site, w]) => renderWriting(site, w))
    .catch(() => {
      document.getElementById("w-headline").textContent = "Content couldn't load — try refreshing.";
    });
</script>
