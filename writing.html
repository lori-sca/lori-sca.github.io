<main>
  <section class="page-hero" id="top">
    <div class="wrap">
      <span class="eyebrow" id="w-eyebrow"></span>
      <h1 id="w-headline"></h1>
      <p class="lede" id="w-lede"></p>
    </div>
  </section>

  <section class="section" id="pipeline">
    <div class="wrap">
      <div class="pipeline-index" id="w-pipeline" style="margin-top:0;">
        <p class="pipe-head" id="w-pipe-head">In the pipeline</p>
        <p class="pipe-note" id="w-note"></p>
        <div id="w-rows"></div>
      </div>
    </div>

  <div class="band" id="contact">
    <div class="wrap">
      <div class="section-head">
        <div class="sh-main">
          <span class="eyebrow" id="sec-contact-eyebrow">Contact</span>
          <h2 id="sec-contact-headline">Get in <em>touch.</em></h2>
        </div>

<script src="site.js"></script>
<script src="motion.js"></script>
<script>
  Promise.all([loadJSON("data/site.json"), loadJSON("data/writing.json")])
    .then(([site, w]) => {
      applySiteChrome(site);
      setMeta(w.meta);
      renderSubnav(w.subnav);
      setText("w-pipe-head", (w.sections && w.sections.pipeline || {}).head);
      const cs = (w.sections || {}).contact || {};
      setText("sec-contact-eyebrow", cs.eyebrow);
      setHeadline(document.getElementById("sec-contact-headline"), cs.headline);
      document.getElementById("w-eyebrow").textContent = w.eyebrow;
      document.getElementById("w-headline").textContent = w.headline;
      document.getElementById("w-lede").textContent = w.lede;
      document.getElementById("w-note").textContent = w.note;
      const rows = document.getElementById("w-rows");
      (w.pipeline || []).forEach((t) => {
        const row = document.createElement("div");
        row.className = "pipe-row";
        const title = document.createElement("span");
        title.className = "pipe-title";
        if (t.link) {
          const a = document.createElement("a");
          a.href = t.link; a.target = "_blank"; a.rel = "noopener";
          a.textContent = t.title;
          title.appendChild(a);
        } else {
          title.textContent = t.title;
        }
        const status = document.createElement("span");
        status.className = "pipe-status";
        status.textContent = (w.labels && w.labels.pipeStatus) || "In the pipeline";
        row.appendChild(title); row.appendChild(status);
        rows.appendChild(row);
      });
    })
    .catch(() => {
      document.getElementById("w-headline").textContent = "Content couldn't load — try refreshing.";
    });
</script>
</body>
</html>
